<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">

<head>
  <title>DUNE - Control Center</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" type="image/vnd.microsoft.icon" href="images/icons/dune.ico" />
  <link rel="stylesheet" type="text/css" href="css/default.css" />

  <script type="text/javascript" src="js/Icons.js"></script>

  <script type="text/javascript" src="js/HTTP.js"></script>
  <script type="text/javascript" src="js/Date.js"></script>
  <script type="text/javascript" src="js/ChartBar.js"></script>
  <script type="text/javascript" src="js/Gauge.js"></script>
  <script type="text/javascript" src="js/TextLabel.js"></script>
  <script type="text/javascript" src="js/AbbrevToLabel.js"></script>
  <script type="text/javascript" src="js/Utils.js"></script>
  <script type="text/javascript" src="js/Angles.js"></script>

  <!-- Sections -->
  <script type="text/javascript" src="js/Sections.js"></script>
  <script type="text/javascript" src="js/BasicSection.js"></script>
  <script type="text/javascript" src="js/Announces.js"></script>
  <script type="text/javascript" src="js/Main.js"></script>
  <script type="text/javascript" src="js/Power.js"></script>
  <script type="text/javascript" src="js/Sensors.js"></script>
  <script type="text/javascript" src="js/Logbook.js"></script>
  <script type="text/javascript" src="js/MicroDUNENodes.js"></script>
  <script type="text/javascript" src="index.js"></script>

</head>

<body class="theme-light"> <!-- Default white theme -->
  <table id="x-body-table">
    <tr>
      <td id="MenuBar">
        <div id="Menu">
          <ul>
            <li id="Main" class="First"><a href="javascript:show('Main')">Main</a></li>
            <li id="Sensors"><a href="javascript:show('Sensors')">Sensors</a></li>
            <li id="Power"><a href="javascript:show('Power')">Power</a></li>
            <li id="MicroDUNENodes" style="display: none"><a href="javascript:show('MicroDUNENodes')">Nodes</a></li>
            <li id="Logbook"><a href="javascript:show('Logbook')">Logbook</a></li>
            <li id="Announces"><a href="javascript:show('Announces')">Discovery Tool</a></li>
            <!-- <li id="Help"><a href="#">Help</a></li> -->
            <li class="Static traffic-item">
              <span id="NetworkTraffic" title="Traffic since this page was opened. Transmitted bytes are estimated.">
                <span class="traffic-rx" title="Data received since this page was opened">
                  <span class="traffic-arrow" aria-hidden="true">&#8595;</span>
                  <strong id="TrafficReceived">0 B</strong>
                </span>
                <span class="traffic-tx" title="Estimated data sent since this page was opened">
                  <span class="traffic-arrow" aria-hidden="true">&#8593;</span>
                  <strong id="TrafficSent">0 B</strong>
                </span>
              </span>
            </li>
            <li class="Static status-item"><span class="icon-control"><img id="ConnectionIcon" src="images/icons/system-off.png"
                title="Disconnected" alt="Disconnected" /></span></li>
            <li class="Static theme-item"><button id="ThemeButton" class="icon-control" type="button" onclick="toggleTheme()"
                title="Change theme" aria-label="Change theme"><span id="ThemeIcon" aria-hidden="true">&#9790;</span></button></li>
          </ul>
        </div>
      </td>
    </tr>
    <tr>
      <td class="infoTable">
        <div id="x-container">
          <div class="logbook-filter">
            <div id="logbook-filters">
              <div class="form-group">
                <label for="context-filter" class="material-label">Filter by Entity:</label>
                <select id="context-filter" class="material-select"
                  onchange="g_logbook.selectedContext = this.value; g_logbook.update();">
                  <option value="all">Show All</option>
                </select>
                <label><input type="checkbox" class="material-checkbox" id="filter-info" checked="checked" /><span
                    class="custom-checkbox"></span> INFO</label>
                <label><input type="checkbox" class="material-checkbox" id="filter-warning" checked="checked" /><span
                    class="custom-checkbox"></span> WARNING</label>
                <label><input type="checkbox" class="material-checkbox" id="filter-error" checked="checked" /><span
                    class="custom-checkbox"></span> ERROR</label>
                <label><input type="checkbox" class="material-checkbox" id="filter-debug" checked="checked" /><span
                    class="custom-checkbox"></span> DEBUG</label>
              </div>
            </div>
          </div>
        </div>
      </td>
    </tr>
  </table>

  <div id="x-copyright">
    <p>Copyright &#169; 2007-2026 - Universidade do Porto</p>
  </div>

</body>

</html>
