    enum TypeEnum
    {
        TP_PREPLAN = 0;
        TP_INPLAN = 1;
        TP_POSTPLAN = 2;
        TP_UNKNOWN = 3;
    }  
    TypeEnum type = 2;  
    optional uint32 properties = 3 [(dccl.field) = { min: 0 max: 255}];
    optional DurationList durations = 4;
    optional string distances = 5 [(dccl.field).max_length = 100];
    optional string actions = 6 [(dccl.field).max_length = 100];
    optional FuelList fuel = 7;
}

//VehicleState
message VehicleState {
    option (dccl.msg) = { codec_version: 4 id: 500};
    enum OperationModeEnum
    {
        VS_SERVICE = 0;
        VS_CALIBRATION = 1;
        VS_ERROR= 2;
        VS_MANEUVER = 3;
        VS_EXTERNAL = 4;
        VS_BOOT = 5;
        VS_UNKNOWN = 6;
    }  
    OperationModeEnum op_mode = 1;  
    optional uint32 error_count = 2 [(dccl.field) = { min: 0 max: 255}];
    optional string error_ents = 3 [(dccl.field).max_length = 100];
    optional uint32 maneuver_type = 4 [(dccl.field) = { min: 0 max: 65535}];
    optional double maneuver_stime = 5 [(dccl.field) = { min: -1 max: 2080224000 precision: 1 }];
    optional uint32 maneuver_eta = 6 [(dccl.field) = { min: 0 max: 65535}];
    optional uint32 control_loops = 7 [(dccl.field) = { min: 0 max: 4294967295}];
    optional uint32 flags = 8 [(dccl.field) = { min: 0 max: 2}];
    optional string last_error = 9 [(dccl.field).max_length = 50];
    optional double last_error_time = 10 [(dccl.field) = { min: -1 max: 2080224000 precision: 1 }];
}

//EntityState
message EntityState {
    option (dccl.msg) = { codec_version: 4 id: 1};
    enum StateEnum
    {
        ESTA_BOOT = 0;
        ESTA_NORMAL = 1;
        ESTA_FAULT= 2;
        ESTA_ERROR = 3;
        ESTA_FAILURE = 4;
        ESTA_UNKNOWN = 5;
    }  
    StateEnum state = 1;  
    optional uint32 flags = 2 [(dccl.field) = { min: 0 max: 2}];
    optional string description = 3 [(dccl.field).max_length = 300];
}

//PlanControlState
message PlanControlState {
    option (dccl.msg) = { codec_version: 4 id: 560};
    enum StateEnum
    {
        PCS_BLOCKED = 0;
        PCS_READY = 1;
        PCS_INITIALIZING = 2;
        PCS_EXECUTING = 3;
        PCS_UNKNOWN = 4;
    }  
    StateEnum state = 1;  
    optional string plan_id = 2 [(dccl.field).max_length = 20];
    optional int32 plan_eta = 3 [(dccl.field) = { min: -1 max: 604800}];
    optional float plan_progress = 4 [(dccl.field) = { min: -1 max: 100 precision: 2 }];
    ManeuverID man_id = 5;
    optional uint32 man_type = 6 [(dccl.field) = { min: 0 max: 65535}];
    optional int32 man_eta = 7 [(dccl.field) = { min: -1 max: 604800}];
    enum LastPlanOutcomeEnum
    {
        LPO_NONE = 0;
        LPO_SUCCESS = 1;
        LPO_FAILURE = 2;
        LPO_UNKNOWN = 3;
    }  
    LastPlanOutcomeEnum last_outcome = 8; 
}

//QueryEntityParameters
message QueryEntityParameters {
    option (dccl.msg) = { codec_version: 4 id: 803 };
    EntityName name = 1; 
    Visibility visibility = 2;
    Scope scope = 3;
}

//Voltage
message Voltage {
    option (dccl.msg) = { codec_version: 4 id: 251};
    optional float value = 1 [(dccl.field) = { min: -100 max: 100 precision: 1 }];
}

//Current
message Current {
    option (dccl.msg) = { codec_version: 4 id: 252};
    optional float value = 1 [(dccl.field) = { min: -100 max: 100 precision: 2}];
}

//FuelLevel
message FuelLevel {
    option (dccl.msg) = { codec_version: 4 id: 279 };
    optional float value = 1 [(dccl.field) = { min: 0 max: 100 precision: 1 }];
    optional float confidence = 2 [(dccl.field) = { min: 0 max: 100 precision: 1 }];
    optional string opmodes = 3 [(dccl.field).max_length = 100];
}

//WindSpeed
message WindSpeed {
    option (dccl.msg) = { codec_version: 4 id: 271 };
    optional float direction = 1 [(dccl.field) = { min: 0 max: 6.283 precision: 3}];
    optional float speed = 2 [(dccl.field) = { min: 0 max: 200 precision: 2 }];
    optional float turbulence = 3 [(dccl.field) = { min: 0 max: 1 precision: 1 }]; 
}

//Power
message Power {
    option (dccl.msg) = { codec_version: 4 id: 364 };
    optional float value = 1 [(dccl.field) = { min: -200 max: 200 precision: 1}];
}


message PlanDBArgUnion {
    option (dccl.msg) = { codec_version: 4 };
    oneof PlanDBArgUnion_{
        PlanSpecification ps_arg = 1;
        PlanDBInformation pi_arg = 2;
        PlanDBState pc_arg = 3;
    }
}

message PlanSpecificationStartActionsUnion {
    option (dccl.msg) = { codec_version: 4};
    oneof PlanSpecificationStartActionsUnion_{
        SetEntityParameters ep = 1;
    }
}

message PlanSpecificationEndActionsUnion {
    option (dccl.msg) = { codec_version: 4};
    oneof PlanSpecificationEndActionsUnion_{
        SetEntityParameters ep = 1;
    }
}

message PlanControlArgUnion {
    option (dccl.msg) = { codec_version: 4};
    oneof PlanDBArgUnion_{
        PlanSpecification ps_arg = 1;
        Maneuver man_arg = 2;
        PlanStatistics stat_arg = 3;
    }
}

// Header
message Header{
   option (dccl.msg) = { codec_version: 4}; 
   optional uint32 timestamp = 1 [(dccl.field) = { min: 1767225600 max: 2082758400}]; 
   optional uint32 src = 2 [(dccl.field) = { min: 0 max: 65535}];
   optional uint32 src_ent = 3 [(dccl.field) = { min: 0 max: 255}];
   optional uint32 dst = 4 [(dccl.field) = { min: 0 max: 65535}];
   optional uint32 dst_ent = 5 [(dccl.field) = { min: 0 max: 255}];
}

message Payload {
    option (dccl.msg) = { codec_version: 4};
    oneof PayloadUnion{
        EstimatedState estimated_state_payload = 1;
        PlanDB plan_db_payload = 2;
        PlanControl plan_control_payload = 3;
        SetEntityParameters set_entity_parameters_payload = 4;
        VehicleState vehicle_state_payload = 5;
        EntityState entity_state_payload = 6;
        PlanControlState plan_control_state_payload = 7;
        VerticalProfile vertical_profile_payload = 8;
        Voltage voltage_payload = 9;
        FuelLevel fuel_level_payload = 10;
        Current current_payload = 11;
        WindSpeed wind_speed_payload = 12;
        EntityParameters entity_parameters_payload = 13;
        EntityList entity_list_payload = 14;
        QueryEntityParameters query_entity_parameters_payload = 15;
        Power power= 16;
    }
}

message ProtoMessage{
    option (dccl.msg) = { codec_version: 4 id: 0 max_bytes: 100000000};
    Header msg_header = 1;
    Payload msg_payload = 2;
}