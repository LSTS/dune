# Stonefish hull models                                                    #
############################################################################

# Hull lifting-body coefficients consumed by Simulators.StoneFish, read from
# [StoneFish/Model/<General.Vehicle Type>]. Same 8-term formulation and units
# as VSIM's "Body Lift Coefficients" (common/vsim-models.ini):
#   Yuv, Yur, Zuw, Zuq, Muw, Muq, Nuv, Nur
# but a StoneFish-specific tuning: Stonefish derives only quadratic drag and
# (isotropic) added mass from the hull mesh, so these also stand in for the
# hull lift and Munk terms the engine lacks. Tuned against the lauv-xplore-4
# field sweep (2026-07). Single source for every StoneFish configuration.

[StoneFish/Model/lauv]
Hull Body Lift Coefficients         = -60.0000,   3.8400, -20.6000,
                                       -3.8400,  -6.0000,  -1.5300,
                                       10.0000,  -5.0000
