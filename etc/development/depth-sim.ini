############################################################################
# Simulated LAUV for the comparison of depth controllers: depth PID of the #
# autopilot (this file), development/depth-sim-pid-20,                     #
# depth-sim-pid-lag-free, depth-sim-pid-tuned, depth-sim-cascade,          #
# depth-sim-cascade-dob, depth-sim-mpc, depth-sim-nonlinear-mpc,           #
# depth-sim-backstepping, depth-sim-smc and depth-sim-sta. Parameters are  #
# those for the vehicle model of the simulator, not a real vehicle. Starts #
# in deep water.                                                           #
############################################################################

[Require ../lauv-simulator-1.ini]

[Simulators.GPS]
Initial Position                        = 41.1850, -8.7250

[Control.AUV.Attitude]
Depth PID Gains                         = 0.6, 0.0, 0.7
Depth Integral Limit                    = -1.0
Pitch PID Gains                         = 1.5, 0.0, 1.1

[Control.AUV.Depth.Cascade]
Heave Gain                              = 0.97
Heave Lag                               = 0.75
Heave Moving Average Samples            = 40
Depth Gain                              = 0.319
Trim Estimator Gain                     = 0.479
Pitch Lead Gain                         = 1.93
Pitch Lead Filter                       = 0.00
Pitch Trim Gain                         = 0.064
Maximum Pitch Reference                 = 15.0
Reachable Pitch Down                    = 14.5
Reachable Pitch Up                      = 13.5
Initial Trim                            = -0.036
Disturbance Observer -- Filter Time     = 0.548

[Control.AUV.Depth.MPC]
